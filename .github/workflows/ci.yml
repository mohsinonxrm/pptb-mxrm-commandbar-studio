name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0" # don't install git hooks on the runner

jobs:
  build:
    name: Typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The thresholds in vitest.config.ts are aspirational (the UI layer has no
      # tests yet), so CI reports coverage without enforcing them for now.
      # TODO(#21): enforce thresholds once coverage reaches them.
      - name: Test (with coverage)
        run: >-
          npm run test:coverage --
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Validate PPTB manifest
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Pack (dry run) and check contents/size
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
