name: Release

# Publishes @mohsinonxrm/pptb-commandbar-studio to npm with trusted publishing
# (OIDC + provenance, no NPM_TOKEN) and creates the GitHub Release.
# Flow and prerequisites: see RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.6.0 or v0.6.0-beta.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected vX.Y.Z or vX.Y.Z-pre.N)"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # need origin/main history for the ancestry check
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          tag_sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::$TAG ($tag_sha) is not on main. Tag the merge commit of the dev → main release PR."
            exit 1
          fi
          echo "$TAG → $tag_sha (on main)"

      - name: Verify tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md \
            | sed -e '/./,$!d' \
            | awk '{ l[NR] = $0 } END { n = NR; while (n > 0 && (l[n] ~ /^[[:space:]]*$/ || l[n] == "---")) n--; for (i = 1; i <= n; i++) print l[i] }' \
            > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Run the release-it bump (see RELEASING.md) before tagging."
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Pinned to the 11.x line because
      # npm 12 no longer includes npm-shrinkwrap.json in the tarball.
      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate PPTB manifest
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Check package contents
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"

      - name: Publish to npm (trusted publishing)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$name@$VERSION is already on npm; skipping publish."
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists; skipping."
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
